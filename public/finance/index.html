<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Money</title>
<meta name="description" content="Your daily income and spending, budgets, bills and money lent or borrowed — on every device you sign in on.">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex">
<link rel="manifest" href="/finance/manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/finance/icon-192.png">
<link rel="icon" href="/finance/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="stylesheet" href="/finance/app.css?v=20261006a">
<script src="/finance/app.js?v=20261006a" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="mark" aria-hidden="true">₹</span>
      <span>My Money<small id="syncState">Saved on this device</small></span>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1"></main>

<button class="fab" id="addBtn" type="button" aria-label="Add a record">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-view="home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </button>
  <button type="button" data-view="tx">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    <span>Records</span>
  </button>
  <button type="button" data-view="reports">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Reports</span>
  </button>
  <button type="button" data-view="more">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    <span>More</span>
  </button>
</nav>

<dialog id="sheet" aria-labelledby="sheetTitle"><form id="sheetForm" novalidate></form></dialog>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
