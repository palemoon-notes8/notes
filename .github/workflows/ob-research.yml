name: OB index option research

# Pattern search on index data; results go to the ob-research branch.
on:
  push:
    branches: [orderblock]
    paths: [research.py, anomalies.py, scalp.py]

concurrency:
  group: ob-research
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run research and publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 research.py out | tee out.log
          python3 anomalies.py out | tee -a out.log
          python3 scalp.py out | tee -a out.log
          mkdir pub && cp out/research.json out/anomalies.json out/scalp.json out.log pub/ && cd pub
          git init -q -b ob-research
          git -c user.name="ob-board bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="ob-board bot" -c user.email="actions@users.noreply.github.com" commit -qm "research $(TZ=Asia/Kolkata date '+%d %b %H:%M')"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ob-research
