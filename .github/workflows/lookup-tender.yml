name: Look up one tender (one-time)

# Finds one tender on KPPP by its number, with a handful of slow requests, and prints its details.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tender number
        required: true
      words:
        description: A few words from the title (KPPP searches titles, not numbers)
        required: false

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: Look up
        env:
          REF: ${{ inputs.ref }}
          WORDS: ${{ inputs.words }}
          KPPP_MIN_INTERVAL: "5"
        run: |
          python3 - <<'PY'
          import json, os
          from kppp_polite import make_session
          from collect_results import API, HEADERS
          ref = os.environ["REF"].strip()
          key = os.environ.get("WORDS", "").strip() or ref
          s = make_session(1)
          hit = None
          for status in ["CLOSED", "PUBLISHED", "AWARDED"]:
              r = s.post(f"{API}/works/search-eproc-tenders?page=0&size=50&order-by-tender-publish=true",
                         json={"category": "WORKS", "status": status, "title": key}, headers=HEADERS, timeout=90)
              try:
                  rows = r.json().get("content") or []
              except Exception:
                  rows = []
              print(status, r.status_code, len(rows), [x.get("tenderNumber") for x in rows][:8])
              for x in rows:
                  if (x.get("tenderNumber") or "").strip().upper() == ref.upper():
                      hit = x
              if hit:
                  break
          if not hit:
              print("NOT FOUND"); raise SystemExit
          print("LIST", json.dumps(hit, ensure_ascii=False))
          full = s.get(f"{API}/{hit['nitId']}/works-tender-full-view", headers=HEADERS, timeout=60).json()
          keep = {k: full.get(k) for k in ("noticeInvitingTenderDTO", "tenderSchedule", "tenderAddress", "generalCriterionList", "technicalCriterionList", "tenderCriterionDocumentList", "tenderAwardDatesDTO", "evalStagesCompletedInfoDTO")}
          print("FULL", json.dumps(keep, ensure_ascii=False)[:20000])
          PY
